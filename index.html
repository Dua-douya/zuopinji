<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>豆芽的作品集</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
  background: #fafbfc;
  overflow-x: hidden;
  overflow-y: auto;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body { display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
body::before {
  content: ''; position: fixed; inset: 0;
  background-image: radial-gradient(rgba(59,130,246,0.04) 1px, transparent 1px);
  background-size: 24px 24px; pointer-events: none; z-index: 0;
}

nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; justify-content: space-between; align-items: center;
  padding: 22px 56px;
  background: rgba(255,255,255,0.7);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(59,130,246,0.06);
}
.logo { font-size: 20px; font-weight: 800; color: #1e293b; letter-spacing: -0.3px; }
.logo span { color: #3B82F6; }
.nav-links { display: flex; gap: 32px; list-style: none; }
.nav-links a {
  text-decoration: none; color: #64748b; font-size: 15px; font-weight: 600;
  transition: color 0.3s ease; position: relative; padding: 4px 0; cursor: pointer;
}
.nav-links a::after {
  content: ''; position: absolute; bottom: -2px; left: 0; width: 0; height: 2px;
  background: #3B82F6; border-radius: 2px; transition: width 0.3s ease;
}
.nav-links a:hover { color: #3B82F6; }
.nav-links a:hover::after { width: 100%; }

main {
  flex: 1; display: flex; align-items: center; justify-content: center;
  width: 100%; z-index: 1; min-height: 100vh; padding-top: 80px;
}

.folder-hover-area {
  position: relative; width: 780px; height: 520px;
  display: flex; align-items: center; justify-content: center; cursor: default;
}
.folder { position: relative; width: 480px; height: 350px; animation: folderBreathe 3.5s ease-in-out infinite; }
@keyframes folderBreathe { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
.folder-tab {
  position: absolute; top: -34px; left: 36px; width: 100px; height: 34px;
  background: linear-gradient(135deg,#3B82F6,#2563EB); border-radius: 18px 18px 0 0;
  z-index: 2; box-shadow: 0 -4px 12px rgba(59,130,246,0.15);
}
.folder-back {
  position: absolute; inset: 0;
  background: linear-gradient(145deg,#3B82F6,#1D4ED8); border-radius: 22px; z-index: 1;
  box-shadow: 0 24px 64px -8px rgba(59,130,246,0.35), 0 4px 16px rgba(59,130,246,0.15);
}
.folder-back::after {
  content: ''; position: absolute; inset: 0; border-radius: 22px;
  background: linear-gradient(180deg, rgba(255,255,255,0.1), transparent 50%); pointer-events: none;
}
.cards-container { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
.card {
  position: absolute; top: 30px; left: 50%; border-radius: 16px;
  pointer-events: auto; cursor: pointer; opacity: 0;
  transition: transform 0.6s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.6s cubic-bezier(0.34,1.56,0.64,1), opacity 0.5s ease;
  transform-origin: center bottom; will-change: transform, opacity;
  box-shadow: 0 6px 24px rgba(0,0,0,0.08);
}
.card:nth-child(1) { width:145px; height:145px; margin-left:-72.5px; transform: translateX(-14px) translateY(6px) rotate(-3deg); z-index:1; }
.card:nth-child(2) { width:125px; height:170px; margin-left:-62.5px; transform: translateX(-7px) translateY(3px) rotate(-1.5deg); z-index:2; }
.card:nth-child(3) { width:150px; height:150px; margin-left:-75px; transform: translateX(0) translateY(0) rotate(0); z-index:5; }
.card:nth-child(4) { width:125px; height:170px; margin-left:-62.5px; transform: translateX(7px) translateY(3px) rotate(1.5deg); z-index:2; }
.card:nth-child(5) { width:145px; height:145px; margin-left:-72.5px; transform: translateX(14px) translateY(6px) rotate(3deg); z-index:1; }
.folder-hover-area.hover .card:nth-child(1), .folder-hover-area.expanded .card:nth-child(1) { transform: translateX(-200px) translateY(-90px) rotate(-28deg); z-index:1; }
.folder-hover-area.hover .card:nth-child(2), .folder-hover-area.expanded .card:nth-child(2) { transform: translateX(-100px) translateY(-110px) rotate(-14deg); z-index:2; }
.folder-hover-area.hover .card:nth-child(3), .folder-hover-area.expanded .card:nth-child(3) { transform: translateX(0) translateY(-115px) rotate(0); z-index:5; }
.folder-hover-area.hover .card:nth-child(4), .folder-hover-area.expanded .card:nth-child(4) { transform: translateX(100px) translateY(-110px) rotate(14deg); z-index:2; }
.folder-hover-area.hover .card:nth-child(5), .folder-hover-area.expanded .card:nth-child(5) { transform: translateX(200px) translateY(-90px) rotate(28deg); z-index:1; }
.card-inner {
  width:100%; height:100%; border-radius:16px; display:flex; flex-direction:column;
  align-items:center; justify-content:center; position:relative; overflow:hidden;
  transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.35s ease;
}
.card-inner::before {
  content:''; position:absolute; inset:0;
  background: linear-gradient(180deg, rgba(255,255,255,0.2), transparent 60%);
  border-radius:16px; pointer-events:none;
}
.card:hover .card-inner { transform: scale(1.1) translateY(-8px); box-shadow: 0 24px 64px rgba(0,0,0,0.2); }
.card-icon { font-size:34px; margin-bottom:6px; opacity:0.9; }
.card-label { font-size:13px; font-weight:700; color:rgba(255,255,255,0.9); letter-spacing:0.8px; text-transform:uppercase; }
.card:nth-child(1) .card-inner { background: linear-gradient(145deg,#FF6B6B,#EE5A24); }
.card:nth-child(2) .card-inner { background: linear-gradient(145deg,#A29BFE,#6C5CE7); }
.card:nth-child(3) .card-inner { background: linear-gradient(145deg,#00CEC9,#00B894); }
.card:nth-child(4) .card-inner { background: linear-gradient(145deg,#74B9FF,#0984E3); }
.card:nth-child(5) .card-inner { background: linear-gradient(145deg,#55EFC4,#00B894); }
.folder-front {
  position: absolute; bottom:0; left:0; right:0; height:260px; z-index:5;
  background: linear-gradient(160deg, rgba(255,255,255,0.2), rgba(255,255,255,0.1) 40%, rgba(59,130,246,0.08));
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-radius: 0 0 22px 22px;
  border: 1px solid rgba(255,255,255,0.25); border-top: 1px solid rgba(255,255,255,0.4);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 8px 32px rgba(0,0,0,0.06);
  pointer-events:none; overflow:hidden;
}
.folder-label {
  position:absolute; bottom:28px; left:34px; z-index:6;
  font-size:14px; font-weight:700; color:rgba(255,255,255,0.6);
  letter-spacing:1px; text-transform:uppercase; pointer-events:none;
}
.folder-arrow {
  position:absolute; right:-56px; bottom:55px; z-index:6; width:44px; height:44px;
  display:flex; align-items:center; justify-content:center;
  animation: arrowFloat 2.8s ease-in-out infinite; pointer-events:none;
}
@keyframes arrowFloat { 0%,100% { transform: translateX(0); opacity:0.5; } 50% { transform: translateX(8px); opacity:0.9; } }
.folder-arrow svg { width:30px; height:30px; color:#3B82F6; opacity:0.55; transition: opacity .4s, transform .4s; filter: drop-shadow(0 2px 4px rgba(59,130,246,0.15)); }
.folder-hover-area:hover .folder-arrow svg { opacity:0.15; transform: translateX(12px); }

.hint-dots { position:fixed; bottom:120px; left:50%; transform:translateX(-50%); display:flex; gap:8px; z-index:100; }
.hint-dots span { width:6px; height:6px; border-radius:50%; background:#cbd5e1; transition: background .3s, width .3s; }
.hint-dots span.active { width:20px; border-radius:3px; background:#3B82F6; }

@media (max-width: 768px) {
  nav { padding: 18px 24px; }
  .nav-links { gap: 20px; }
  .folder { width: 380px; height: 280px; }
  .folder-tab { width: 80px; height: 28px; top: -28px; left: 28px; border-radius: 14px 14px 0 0; }
  .folder-front { height: 210px; }
  .folder-hover-area { width: 600px; height: 420px; }
  .card { top: 24px; }
  .card:nth-child(1) { width:115px; height:115px; margin-left:-57.5px; }
  .card:nth-child(2) { width:100px; height:135px; margin-left:-50px; }
  .card:nth-child(3) { width:120px; height:120px; margin-left:-60px; }
  .card:nth-child(4) { width:100px; height:135px; margin-left:-50px; }
  .card:nth-child(5) { width:115px; height:115px; margin-left:-57.5px; }
  .folder-hover-area.hover .card:nth-child(1), .folder-hover-area.expanded .card:nth-child(1) { transform: translateX(-160px) translateY(-70px) rotate(-28deg); }
  .folder-hover-area.hover .card:nth-child(2), .folder-hover-area.expanded .card:nth-child(2) { transform: translateX(-80px) translateY(-90px) rotate(-14deg); }
  .folder-hover-area.hover .card:nth-child(3), .folder-hover-area.expanded .card:nth-child(3) { transform: translateX(0) translateY(-95px) rotate(0); }
  .folder-hover-area.hover .card:nth-child(4), .folder-hover-area.expanded .card:nth-child(4) { transform: translateX(80px) translateY(-90px) rotate(14deg); }
  .folder-hover-area.hover .card:nth-child(5), .folder-hover-area.expanded .card:nth-child(5) { transform: translateX(160px) translateY(-70px) rotate(28deg); }
}
@media (max-width: 600px) {
  nav { padding: 14px 16px; }
  .nav-links { gap: 14px; }
  .nav-links a { font-size: 13px; }
  .logo { font-size: 16px; }
  main { padding: 74px 10px 22px; }
  .folder { width: min(78vw, 300px); height: min(60vw, 230px); min-height: 205px; }
  .folder-tab { width: 66px; height: 24px; top: -24px; left: 22px; border-radius: 12px 12px 0 0; }
  .folder-front { height: 170px; }
  .folder-hover-area { width: 100%; height: min(90vw, 360px); min-height: 330px; }
  .folder-arrow { display: none; }
  .folder-label { font-size: 11px; bottom: 20px; left: 22px; }
  .card { top: 18px; }
  .card-icon { font-size: 24px; }
  .card-label { font-size: 10px; }
  .card:nth-child(1) { width:90px; height:90px; margin-left:-45px; }
  .card:nth-child(2) { width:78px; height:105px; margin-left:-39px; }
  .card:nth-child(3) { width:94px; height:94px; margin-left:-47px; }
  .card:nth-child(4) { width:78px; height:105px; margin-left:-39px; }
  .card:nth-child(5) { width:90px; height:90px; margin-left:-45px; }
  .folder-hover-area.hover .card:nth-child(1), .folder-hover-area.expanded .card:nth-child(1) { transform: translateX(-94px) translateY(-55px) rotate(-24deg); }
  .folder-hover-area.hover .card:nth-child(2), .folder-hover-area.expanded .card:nth-child(2) { transform: translateX(-47px) translateY(-65px) rotate(-12deg); }
  .folder-hover-area.hover .card:nth-child(3), .folder-hover-area.expanded .card:nth-child(3) { transform: translateX(0) translateY(-70px) rotate(0); }
  .folder-hover-area.hover .card:nth-child(4), .folder-hover-area.expanded .card:nth-child(4) { transform: translateX(47px) translateY(-65px) rotate(12deg); }
  .folder-hover-area.hover .card:nth-child(5), .folder-hover-area.expanded .card:nth-child(5) { transform: translateX(94px) translateY(-55px) rotate(24deg); }
}
@media (max-height: 760px) {
  main { padding-top: 60px; min-height: 100vh; }
  .folder-hover-area { transform: scale(0.82); }
}

/* ===== 内容页（通栏铺满）===== */
.content-view {
  display: none; position: relative; z-index: 1;
  width: 100%; max-width: 1560px; margin: 0 auto;
  padding: 132px 72px 160px;
}
body.content-mode .content-view.is-active { display: block; }
body.content-mode main { display: none; }
body.content-mode .hint-dots { display: none; }

.head { margin-bottom: 44px; }
.kicker { font-size: 14px; font-weight: 800; letter-spacing: 4px; color: #3B82F6; text-transform: uppercase; }
.content-view h1 { font-size: clamp(40px, 5vw, 68px); font-weight: 800; letter-spacing: -1.5px; line-height: 1.05; color: #12203a; margin: 10px 0 12px; }
.lede { color: #64748b; font-size: clamp(17px, 1.4vw, 19px); line-height: 1.75; max-width: 70ch; }

.block { margin: 0 0 64px; }
.block-title { font-size: 22px; font-weight: 800; margin-bottom: 22px; display: flex; align-items: center; gap: 10px; color: #12203a; }

/* 图集：整图通栏显示，横向铺满内容区 */
.gallery { display: flex; flex-direction: column; gap: 28px; width: 100%; }
.art {
  width: 100%;
  background: #fff; border-radius: 18px; overflow: hidden;
  box-shadow: 0 16px 46px rgba(15,23,42,0.14);
  animation: rise 0.5s both; cursor: zoom-in;
}
.art img { display: block; width: 100%; height: auto; }
.art:hover { transform: translateY(-4px); }

/* 视频：通栏宽、从上到下竖排循环 */
.videos { display: flex; flex-direction: column; gap: 34px; width: 100%; }
.video-card {
  width: 100%;
  background: #0f172a; border-radius: 18px; overflow: hidden;
  box-shadow: 0 18px 46px rgba(15,23,42,0.22);
  animation: rise 0.55s both;
}
.video-card video { width: 100%; display: block; aspect-ratio: 16/9; background: #000; }
.video-cap { padding: 13px 18px 16px; font-size: 14px; color: #cbd5e1; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

@keyframes rise { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: none; } }

/* ===== 底部常驻导航 ===== */
.bottom-bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 300;
  display: none; justify-content: center; align-items: center; gap: 12px;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: rgba(255,255,255,0.86);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid rgba(255,255,255,0.75);
  box-shadow: 0 -12px 40px rgba(15,23,42,0.12);
}
body.content-mode .bottom-bar { display: flex; }
.bb-btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 26px; border-radius: 999px; font-size: 14.5px; font-weight: 700;
  font-family: inherit; color: #334155; border: none; cursor: pointer; white-space: nowrap;
  background: #fff; box-shadow: 0 6px 18px rgba(15,23,42,0.08);
  transition: background .25s, color .25s, transform .25s;
}
.bb-btn:hover { background: #eef4ff; color: #1D4ED8; transform: translateY(-2px); }
.bb-home { background: linear-gradient(135deg,#3B82F6,#1D4ED8); color: #fff; box-shadow: 0 10px 24px rgba(37,99,235,0.35); }
.bb-home:hover { background: linear-gradient(135deg,#4f8ef7,#2563eb); color: #fff; }
.bb-btn.small { padding: 12px 20px; }

@media (max-width: 1100px) { .content-view { padding: 120px 40px 150px; } }
@media (max-width: 820px) {
  .content-view { padding: 108px 20px 150px; }
  .bb-btn { padding: 11px 15px; font-size: 13.5px; }
  .bb-btn.small { padding: 11px 12px; }
}
@media (max-width: 560px) {
  .bottom-bar { display:none; grid-template-columns:1fr 1.2fr 1fr; gap:7px; padding:10px 8px calc(10px + env(safe-area-inset-bottom)); }
  body.content-mode .bottom-bar { display:grid; }
  .bb-btn,.bb-btn.small { width:100%; justify-content:center; padding:10px 6px; font-size:13px; overflow:hidden; text-overflow:ellipsis; }
  .gallery { gap: 18px; }
  .content-view { padding:96px 14px 120px; }
  .content-view h1 { font-size:38px; }
  .block { margin-bottom:44px; }
  .block-title { font-size:18px; margin-bottom:14px; }
}

/* UX 画板：等宽网格 + 高清查看器 */
.ux-board-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:24px; }
.ux-board-card { border:0; padding:0; overflow:hidden; border-radius:18px; background:#fff; color:#334155; cursor:zoom-in; box-shadow:0 14px 38px rgba(15,23,42,.12); text-align:left; transition:transform .25s,box-shadow .25s; }
.ux-board-card:hover { transform:translateY(-4px); box-shadow:0 20px 46px rgba(15,23,42,.18); }
.ux-board-preview { height:440px; display:flex; align-items:flex-start; justify-content:center; overflow:hidden; background:#eef2f7; }
.ux-board-preview img { display:block; width:100%; height:100%; object-fit:contain; object-position:top center; }
.ux-board-caption { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 18px; font-size:16px; font-weight:800; }
.ux-board-caption span:last-child { color:#3b82f6; font-size:14px; font-weight:700; }
.image-viewer { width:100vw; max-width:none; height:100vh; max-height:none; margin:0; padding:0; border:0; background:#111827; color:#fff; display:none; flex-direction:column; }
.image-viewer[open] { display:flex; }
.image-viewer::backdrop { background:rgba(2,6,23,.88); }
.viewer-toolbar { order:2; flex:0 0 auto; z-index:2; display:grid; grid-template-columns:auto auto minmax(120px,1fr) auto auto; align-items:center; gap:10px; padding:12px max(16px,calc((100vw - 760px)/2)) calc(12px + env(safe-area-inset-bottom)); background:rgba(255,255,255,.94); color:#334155; border-top:1px solid rgba(15,23,42,.08); box-shadow:0 -12px 40px rgba(2,6,23,.18); backdrop-filter:blur(18px); }
.viewer-title { text-align:center; font-size:14px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.viewer-hint { text-align:center; color:#64748b; font-size:13px; font-weight:700; white-space:nowrap; }
.viewer-toolbar button,.viewer-toolbar a { border:0; border-radius:999px; padding:9px 14px; background:#26344b; color:#fff; font:inherit; font-size:13px; text-decoration:none; cursor:pointer; }
.viewer-toolbar button:hover,.viewer-toolbar a:hover { background:#3b82f6; }
.viewer-toolbar button:disabled { opacity:.35; cursor:default; }
.viewer-back { background:linear-gradient(135deg,#3b82f6,#1d4ed8)!important; }
.viewer-canvas { order:1; flex:1 1 auto; min-height:0; overflow:auto; padding:28px; text-align:center; overscroll-behavior:contain; }
.viewer-canvas img { display:block; margin:0 auto; max-width:none; height:auto; background:#fff; box-shadow:0 12px 48px rgba(0,0,0,.35); }
.resume-table-card { cursor:zoom-in; }
@media (max-width:820px) { .ux-board-grid{grid-template-columns:1fr;gap:16px}.ux-board-preview{height:min(116vw,440px)}.viewer-toolbar{grid-template-columns:1fr 1.25fr 1fr;padding:10px 8px calc(10px + env(safe-area-inset-bottom));gap:7px}.viewer-title{grid-column:1/-1;grid-row:1;font-size:15px}#viewerPrev{grid-column:1;grid-row:2}#viewerBack{grid-column:2;grid-row:2}#viewerNext{grid-column:3;grid-row:2}.viewer-toolbar button{padding:10px 7px;font-size:13px}.viewer-canvas{padding:10px}.viewer-hint{display:none} }

/* 首次加载进度 */
body.is-loading { overflow: hidden; }
.page-loader { position: fixed; inset: 0; z-index: 10000; display: grid; place-items: center; padding: 24px; background: #fafbfc; transition: opacity .3s ease; }
.page-loader.is-done { opacity: 0; pointer-events: none; }
.loader-panel { width: min(340px, 100%); text-align: center; color: #1e293b; }
.loader-spinner { width: 44px; height: 44px; margin: 0 auto 24px; border: 4px solid #dbeafe; border-top-color: #3b82f6; border-radius: 50%; animation: loaderSpin .9s linear infinite; }
.loader-title { font-size: 20px; font-weight: 800; margin-bottom: 12px; }
.loader-detail { color: #64748b; font-size: 14px; line-height: 1.8; min-height: 50px; }
.loader-progress { width: 100%; height: 6px; margin: 20px 0 10px; accent-color: #3b82f6; }
.loader-count { font-size: 13px; color: #3b82f6; font-variant-numeric: tabular-nums; }
.loader-actions { display: flex; gap: 10px; justify-content: center; margin-top: 22px; }
.loader-actions[hidden] { display: none; }
.loader-actions button { border: 0; border-radius: 999px; padding: 11px 18px; font: inherit; font-size: 13px; cursor: pointer; background: #eaf2ff; color: #2563eb; }
@keyframes loaderSpin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .loader-spinner { animation: none; } .page-loader { transition: none; } }

</style>
</head>
<body class="is-loading">

<div class="page-loader" id="pageLoader" role="status" aria-live="polite">
  <div class="loader-panel">
    <div class="loader-spinner" aria-hidden="true"></div>
    <div class="loader-title" id="loaderTitle">正在打开豆芽的作品集</div>
    <p class="loader-detail" id="loaderDetail">正在准备电脑与手机布局</p>
    <progress class="loader-progress" id="loaderProgress" value="0" max="3" aria-label="页面加载进度"></progress>
    <div class="loader-count" id="loaderCount">正在准备界面 0 / 3</div>
    <div class="loader-actions" id="loaderActions" hidden>
      <button type="button" id="loaderRetry">重新加载</button>
      <button type="button" id="loaderContinue">先进入作品集</button>
    </div>
  </div>
</div>
<noscript><style>.page-loader { display:none; } .card {opacity:1;}</style></noscript>


<nav>
  <div class="logo"><span>✦</span> 豆芽的作品集</div>
  <ul class="nav-links">
    <li><a href="#" id="navWork">作品</a></li>
  </ul>
</nav>

<main>
  <div class="folder-hover-area" id="folderHoverArea">
    <div class="folder-arrow" id="folderArrow">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
    </div>
    <div class="folder" id="folder">
      <div class="folder-tab"></div>
      <div class="folder-back"></div>
      <div class="cards-container" id="cardsContainer">
        <div class="card" data-view="resume"><div class="card-inner"><span class="card-icon">📄</span><span class="card-label">简历</span></div></div>
        <div class="card" data-view="ui"><div class="card-inner"><span class="card-icon">🎨</span><span class="card-label">UI</span></div></div>
        <div class="card" data-view="ux"><div class="card-inner"><span class="card-icon">🎬</span><span class="card-label">UX</span></div></div>
        <div class="card" data-view="refactor"><div class="card-inner"><span class="card-icon">🧩</span><span class="card-label">规范&amp;重构</span></div></div>
        <div class="card" data-view="ai"><div class="card-inner"><span class="card-icon">🤖</span><span class="card-label">AI</span></div></div>
      </div>
      <div class="folder-front"><span class="folder-label">豆芽的作品集</span></div>
    </div>
  </div>
</main>

<section class="content-view" id="view-resume" data-key="resume">
  <div class="head">
    <div class="kicker">01 / 简历</div>
    <h1>简历</h1>
    <p class="lede">个人简历与作品总览。</p>
  </div>
  <div class="block"><h2 class="block-title">🖼 简历</h2><div class="gallery" id="gallery-resume"></div></div>
  <div class="block"><h2 class="block-title">🎮 过往游戏经历</h2><div class="gallery"><button type="button" class="art resume-table-card" data-full="assets/resume/game-history.svg" data-title="过往游戏经历"><img src="assets/resume/game-history.svg" alt="过往游戏经历表"></button></div></div>
</section>

<section class="content-view" id="view-ui" data-key="ui">
  <div class="head">
    <div class="kicker">02 / UI</div>
    <h1>UI 视觉</h1>
    <p class="lede">界面视觉设计作品。</p>
  </div>
  <div class="block"><h2 class="block-title">🖼 图集</h2><div class="gallery" id="gallery-ui"></div></div>
</section>

<section class="content-view" id="view-ux" data-key="ux">
  <div class="head">
    <div class="kicker">03 / UX</div>
    <h1>UX 体验</h1>
    <p class="lede">体验设计与交互流程。</p>
  </div>
  <div class="block"><h2 class="block-title">🧭 UX 画板</h2><div class="ux-board-grid" id="uxBoardGrid"></div></div>
  <div class="block"><h2 class="block-title">🎬 交互视频</h2><div class="videos" id="videos-ux"></div></div>
</section>

<dialog class="image-viewer" id="imageViewer">
  <div class="viewer-toolbar">
    <button type="button" id="viewerPrev">◀ 上一张</button>
    <button type="button" class="viewer-back" id="viewerBack">返回 UX</button>
    <span class="viewer-title" id="viewerTitle">高清画板</span>
    <span class="viewer-hint">Ctrl + 鼠标滚轮缩放</span>
    <button type="button" id="viewerNext">下一张 ▶</button>
  </div>
  <div class="viewer-canvas" id="viewerCanvas"><img id="viewerImage" alt="高清作品图"></div>
</dialog>

<section class="content-view" id="view-refactor" data-key="refactor">
  <div class="head">
    <div class="kicker">04 / 规范&amp;重构</div>
    <h1>规范&amp;重构</h1>
    <p class="lede">设计规范梳理与界面重构实践。</p>
  </div>
  <div class="block"><h2 class="block-title">🖼 图集</h2><div class="gallery" id="gallery-refactor"></div></div>
</section>

<section class="content-view" id="view-ai" data-key="ai">
  <div class="head">
    <div class="kicker">05 / AI</div>
    <h1>AI</h1>
    <p class="lede">AI 相关探索与产出。</p>
  </div>
  <div class="block"><h2 class="block-title">🖼 图集</h2><div class="gallery" id="gallery-ai"></div></div>
</section>

<div class="bottom-bar">
  <button type="button" class="bb-btn small" id="btnPrev">◀ 上一页</button>
  <button type="button" class="bb-btn bb-home" id="btnHome">⌂ 返回主界面</button>
  <button type="button" class="bb-btn small" id="btnNext">下一页 ▶</button>
</div>

<script>
/* 数据由 build_site.py 注入：images 为 base64 内嵌，videos 为文件名（相对 ./video/） */
var DATA = {"images":{"resume":["assets/resume/企业微信截图_17916109822899.png"],"ui":["assets/ui/企业微信截图_17916113297865.png"],"refactor":["assets/refactor/企业微信截图_17916222806013.png"],"ai":["assets/ai/企业微信截图_17916198114788.png"]},"uxBoards":[{"thumb":"assets/ux/thumbs/ux-01.webp","full":"assets/ux/ux-01.svg","name":"UX 画板 01"},{"thumb":"assets/ux/thumbs/ux-02.webp","full":"assets/ux/ux-02.svg","name":"UX 画板 02"},{"thumb":"assets/ux/thumbs/ux-03.webp","full":"assets/ux/ux-03.svg","name":"UX 画板 03"},{"thumb":"assets/ux/thumbs/ux-04.webp","full":"assets/ux/ux-04.svg","name":"UX 画板 04"},{"thumb":"assets/ux/thumbs/ux-05.webp","full":"assets/ux/ux-05.svg","name":"UX 画板 05"},{"thumb":"assets/ux/thumbs/ux-06.webp","full":"assets/ux/ux-06.svg","name":"UX 画板 06"},{"thumb":"assets/ux/thumbs/ux-07.webp","full":"assets/ux/ux-07.svg","name":"UX 画板 07"}],"videos":{"ux":[{"file":"video/video_01.mp4","name":"Infinity Dragons 2026-10-10 10-28-48.mp4"},{"file":"video/video_02.mp4","name":"Infinity Dragons 2026-10-10 10-31-02.mp4"},{"file":"video/video_03.mp4","name":"Infinity Dragons 2026-10-10 10-33-35.mp4"},{"file":"video/video_04.mp4","name":"Infinity Dragons 2026-10-10 10-40-48.mp4"},{"file":"video/video_05.mp4","name":"client - world_1 - Windows, Mac, Linux - Unity 2022.3.62f2 _DX11_ 2026-10-10 10-46-12.mp4"},{"file":"video/video_06.mp4","name":"client - world_1 - Windows, Mac, Linux - Unity 2022.3.62f2 _DX11_ 2026-10-10 10-46-45.mp4"}]}};

DATA.images.resume = ["assets/resume/resume-preview.webp"];
DATA.images.ai = ["assets/ai/ai-project-preview-final.jpg?v=1"];

(function () {
  var VIEWS = ['resume', 'ui', 'ux', 'refactor', 'ai'];
  var VIEW_TITLES = { resume: '简历', ui: 'UI', ux: 'UX', refactor: '规范&重构', ai: 'AI' };

  var hoverArea = document.getElementById('folderHoverArea');
  var cards = document.querySelectorAll('.card');
  var folder = document.getElementById('folder');
  var btnPrev = document.getElementById('btnPrev');
  var btnNext = document.getElementById('btnNext');
  var btnHome = document.getElementById('btnHome');
  var touchLayout = window.matchMedia('(hover: none), (pointer: coarse)');
  var hoverTimer = null, currentView = 'home';

  function showView(key) {
    if (VIEWS.indexOf(key) === -1) return;
    currentView = key;
    document.body.classList.add('content-mode');
    var sections = document.querySelectorAll('.content-view');
    for (var i = 0; i < sections.length; i++) {
      sections[i].classList.toggle('is-active', sections[i].getAttribute('data-key') === key);
    }
    var idx = VIEWS.indexOf(key);
    var prevKey = VIEWS[(idx - 1 + VIEWS.length) % VIEWS.length];
    var nextKey = VIEWS[(idx + 1) % VIEWS.length];
    btnPrev.textContent = '◀ ' + VIEW_TITLES[prevKey];
    btnPrev.setAttribute('data-go', prevKey);
    btnNext.textContent = VIEW_TITLES[nextKey] + ' ▶';
    btnNext.setAttribute('data-go', nextKey);
    scrollTop();
  }

  function showHome() {
    currentView = 'home';
    document.body.classList.remove('content-mode');
    hoverArea.classList.remove('expanded');
    folder.style.animationPlayState = 'running';
    var sections = document.querySelectorAll('.content-view');
    for (var i = 0; i < sections.length; i++) sections[i].classList.remove('is-active');
    scrollTop();
  }

  function scrollTop() {
    window.scrollTo(0, 0);
    document.documentElement.scrollTop = 0;
    document.body.scrollTop = 0;
  }

  hoverArea.addEventListener('mouseenter', function () { clearTimeout(hoverTimer); hoverArea.classList.add('hover'); });
  hoverArea.addEventListener('mouseleave', function () { hoverTimer = setTimeout(function () { hoverArea.classList.remove('hover'); }, 120); });
  hoverArea.addEventListener('mouseenter', function () { folder.style.animationPlayState = 'paused'; });
  hoverArea.addEventListener('mouseleave', function () { folder.style.animationPlayState = 'running'; });
  hoverArea.addEventListener('click', function () {
    if (touchLayout.matches && !hoverArea.classList.contains('expanded')) {
      hoverArea.classList.add('expanded');
      folder.style.animationPlayState = 'paused';
    }
  });

  for (var c = 0; c < cards.length; c++) {
    (function (card) {
      card.addEventListener('click', function (e) {
        e.stopPropagation();
        if (touchLayout.matches && !hoverArea.classList.contains('expanded')) {
          hoverArea.classList.add('expanded');
          folder.style.animationPlayState = 'paused';
          return;
        }
        var inner = card.querySelector('.card-inner');
        inner.style.transform = 'scale(0.95)';
        setTimeout(function () { inner.style.transform = ''; }, 180);
        var key = card.getAttribute('data-view');
        if (key) setTimeout(function () { showView(key); }, 140);
      });
    })(cards[c]);
  }

  btnPrev.addEventListener('click', function () { showView(btnPrev.getAttribute('data-go')); });
  btnNext.addEventListener('click', function () { showView(btnNext.getAttribute('data-go')); });
  btnHome.addEventListener('click', showHome);
  document.getElementById('navWork').addEventListener('click', function (e) { e.preventDefault(); showHome(); });

  document.addEventListener('keydown', function (e) {
    var t = e.target;
    if (t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
    if (viewer && viewer.open) {
      if (e.key === 'ArrowLeft') { e.preventDefault(); changeViewer(-1); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); changeViewer(1); }
      else if (e.key === 'Escape') { e.preventDefault(); closeViewer(); }
      return;
    }
    if (e.altKey || e.ctrlKey || e.metaKey || currentView === 'home') return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); showView(btnPrev.getAttribute('data-go')); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); showView(btnNext.getAttribute('data-go')); }
    else if (e.key === 'Escape') { e.preventDefault(); showHome(); }
  });

  function renderGallery(containerId, items) {
    var box = document.getElementById(containerId);
    if (!box) return;
    box.innerHTML = '';
    if (!items || !items.length) {
      box.innerHTML = '<p style="margin:40px 0;text-align:center;color:#94a3b8;">暂无图片</p>';
      return;
    }
    for (var i = 0; i < items.length; i++) {
      (function (src) {
        var art = document.createElement('a');
        art.className = 'art';
        art.href = src; art.target = '_blank'; art.rel = 'noopener';
        if (containerId === 'gallery-resume') {
          art.href = 'assets/resume/resume.svg';
          art.addEventListener('click', function (e) {
            e.preventDefault();
            openViewer('assets/resume/resume.svg', '简历', 'resume');
          });
        } else if (containerId === 'gallery-ai') {
          art.href = 'assets/ai/ai-project.svg';
          art.addEventListener('click', function (e) {
            e.preventDefault();
            openViewer('assets/ai/ai-project.svg', 'AI 项目', 'ai');
          });
        }
        var img = document.createElement('img');
        img.src = src; img.alt = '作品图';
        if (containerId === 'gallery-ai') {
          img.loading = 'eager';
          img.fetchPriority = 'high';
        } else {
          img.loading = 'lazy';
        }
        img.decoding = 'async';
        img.onerror = function () { art.innerHTML = '<p style="color:#94a3b8;font-size:14px;text-align:center;padding:60px 0;">图片未找到</p>'; };
        art.appendChild(img);
        box.appendChild(art);
      })(items[i]);
    }
  }

  function renderVideos(containerId, items) {
    var box = document.getElementById(containerId);
    if (!box) return;
    box.innerHTML = '';
    if (!items || !items.length) {
      box.innerHTML = '<p style="margin:40px 0;text-align:center;color:#94a3b8;">暂无视频</p>';
      return;
    }
    for (var i = 0; i < items.length; i++) {
      (function (item, idx) {
        var wrap = document.createElement('figure');
        wrap.className = 'video-card';
        wrap.style.animationDelay = Math.min(idx * 60, 400) + 'ms';
        var v = document.createElement('video');
        v.src = item.file;
        v.controls = true; v.loop = true; v.muted = true; v.defaultMuted = true;
        v.playsInline = true; v.preload = 'none';
        v.setAttribute('muted', ''); v.setAttribute('playsinline', ''); v.setAttribute('webkit-playsinline', '');
        var cap = document.createElement('figcaption');
        cap.className = 'video-cap';
        cap.textContent = item.name;
        wrap.appendChild(v); wrap.appendChild(cap);
        box.appendChild(wrap);
      })(items[i], i);
    }
  }

  var viewer = document.getElementById('imageViewer');
  var viewerImage = document.getElementById('viewerImage');
  var viewerCanvas = document.getElementById('viewerCanvas');
  var viewerTitle = document.getElementById('viewerTitle');
  var viewerPrev = document.getElementById('viewerPrev');
  var viewerNext = document.getElementById('viewerNext');
  var viewerBack = document.getElementById('viewerBack');
  var viewerZoom = 1;
  var viewerItems = [], viewerIndex = 0, viewerReturnView = 'ux';
  function applyViewerZoom() { viewerImage.style.width = Math.max(80, Math.round(viewerImage.naturalWidth * viewerZoom)) + 'px'; }
  function fitViewer() { if (!viewerImage.naturalWidth) return; viewerZoom = Math.min(1, (viewerCanvas.clientWidth - 28) / viewerImage.naturalWidth); applyViewerZoom(); viewerCanvas.scrollTo(0,0); }
  function currentViewerItem() { return viewerItems[viewerIndex] || {}; }
  function loadViewerItem() {
    var item = currentViewerItem();
    var src = item.full || item.src;
    viewerTitle.textContent = item.name || '高清作品图';
    viewerImage.removeAttribute('src');
    viewerImage.onload = fitViewer;
    viewerImage.src = src;
    viewerPrev.disabled = viewerItems.length < 2;
    viewerNext.disabled = viewerItems.length < 2;
  }
  function openViewer(src, title, returnView, items, index) {
    viewerReturnView = returnView || currentView || 'ux';
    viewerItems = items && items.length ? items : [{ full: src, name: title }];
    viewerIndex = typeof index === 'number' ? index : 0;
    viewerBack.textContent = '返回' + (VIEW_TITLES[viewerReturnView] || '上一级');
    if (!viewer.open) viewer.showModal();
    loadViewerItem();
  }
  function changeViewer(step) {
    if (viewerItems.length < 2) return;
    viewerIndex = (viewerIndex + step + viewerItems.length) % viewerItems.length;
    loadViewerItem();
  }
  function closeViewer() { if (viewer.open) viewer.close(); viewerImage.removeAttribute('src'); showView(viewerReturnView); }
  viewerPrev.addEventListener('click', function(){ changeViewer(-1); });
  viewerNext.addEventListener('click', function(){ changeViewer(1); });
  viewerBack.addEventListener('click', closeViewer);
  viewerCanvas.addEventListener('wheel', function(e){
    if (!e.ctrlKey) return;
    e.preventDefault();
    viewerZoom = Math.max(.05, Math.min(4, viewerZoom * (e.deltaY < 0 ? 1.12 : .89)));
    applyViewerZoom();
  }, { passive:false });
  document.querySelector('.resume-table-card').addEventListener('click', function(){ openViewer(this.getAttribute('data-full'), this.getAttribute('data-title'), 'resume'); });

  function renderUxBoards(items) {
    var box = document.getElementById('uxBoardGrid');
    for (var i = 0; i < items.length; i++) {
      (function(item, idx){
        var card = document.createElement('button'); card.type='button'; card.className='ux-board-card';
        var preview = document.createElement('div'); preview.className='ux-board-preview';
        var img = document.createElement('img'); img.src=item.thumb; img.alt=item.name; img.loading='lazy'; img.decoding='async';
        var caption = document.createElement('div'); caption.className='ux-board-caption'; caption.innerHTML='<span>'+item.name+'</span><span>点击放大查看</span>';
        preview.appendChild(img); card.appendChild(preview); card.appendChild(caption); box.appendChild(card);
        card.addEventListener('click', function(){ openViewer(item.full, item.name, 'ux', items, idx); });
      })(items[i], i);
    }
  }

  var groups = ['resume', 'ui', 'refactor', 'ai'];
  for (var g = 0; g < groups.length; g++) {
    var key = groups[g];
    renderGallery('gallery-' + key, DATA.images[key] || []);
  }
  renderUxBoards(DATA.uxBoards || []);
  renderVideos('videos-ux', DATA.videos.ux || []);


  // 首屏只等待页面骨架；作品图和视频在进入对应栏目后按需加载。
  var loader = document.getElementById('pageLoader');
  var progress = document.getElementById('loaderProgress');
  var count = document.getElementById('loaderCount');
  var detail = document.getElementById('loaderDetail');
  var dismissed = false;
  progress.max = 3;
  progress.value = 1;
  count.textContent = '正在准备界面 1 / 3';
  detail.textContent = '正在准备电脑与手机布局';
  var pageControls = document.querySelectorAll('nav, main, .content-view, .bottom-bar');
  for (var pc = 0; pc < pageControls.length; pc++) pageControls[pc].inert = true;

  function enterPortfolio() {
    if (dismissed) return;
    dismissed = true;
    document.body.classList.remove('is-loading');
    for (var pc = 0; pc < pageControls.length; pc++) pageControls[pc].inert = false;
    for (var i = 0; i < cards.length; i++) cards[i].style.opacity = '1';
    loader.classList.add('is-done');
    setTimeout(function () { loader.hidden = true; loader.style.display = 'none'; }, 320);
  }
  document.getElementById('loaderContinue').addEventListener('click', enterPortfolio);
  document.getElementById('loaderRetry').addEventListener('click', function () { window.location.reload(); });
  requestAnimationFrame(function () {
    progress.value = 2;
    count.textContent = '正在准备界面 2 / 3';
    detail.textContent = '作品将在打开栏目时清晰加载';
    setTimeout(function () {
      progress.value = 3;
      count.textContent = '界面已就绪 3 / 3';
      document.getElementById('loaderTitle').textContent = '加载完成';
      detail.textContent = '正在进入作品集';
      setTimeout(enterPortfolio, 180);
    }, 160);
  });

})();
</script>

</body>
</html>
