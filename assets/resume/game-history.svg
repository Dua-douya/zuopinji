<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2766" viewBox="0 0 1800 2766">
<rect width="100%" height="100%" fill="#F8FAFC"/>
<style>
text{font-family:"Microsoft YaHei","PingFang SC",sans-serif;fill:#1E293B}
.title{font-size:48px;font-weight:700} .sub{font-size:22px;fill:#64748B}
.head{font-size:22px;font-weight:700;fill:white} .cell{font-size:21px} .desc{font-size:19px;fill:#475569}
</style>
<text x="72" y="82" class="title">过往游戏经历</text>
<text x="72" y="126" class="sub">从经典主机、PC 到移动与 VR，覆盖多种玩法与体验类型</text>
<rect x="72" y="210" width="1656" height="78" rx="18" fill="#2563EB"/>
<text x="94" y="259" class="head">游戏名称</text><text x="474" y="259" class="head">平台</text><text x="684" y="259" class="head">类型</text><text x="1014" y="259" class="head">体验与理解</text><rect x="72" y="288" width="1656" height="96" fill="#FFFFFF"/><line x1="452" y1="302" x2="452" y2="370" stroke="#DCE7F5"/><line x1="662" y1="302" x2="662" y2="370" stroke="#DCE7F5"/><line x1="992" y1="302" x2="992" y2="370" stroke="#DCE7F5"/><text x="94" y="344" class="cell" font-weight="600">超级玛丽、魂斗罗等</text><text x="474" y="344" class="cell">主机（FC）</text><text x="684" y="331" class="cell"><tspan x="684" dy="0">动作（平台跳跃/射击）</tspan></text><text x="1014" y="318" class="desc"><tspan x="1014" dy="0">一个练跳跃一个练手速，</tspan><tspan x="1014" dy="26">FC启蒙的双倍快乐</tspan></text><rect x="72" y="384" width="1656" height="96" fill="#EFF6FF"/><line x1="452" y1="398" x2="452" y2="466" stroke="#DCE7F5"/><line x1="662" y1="398" x2="662" y2="466" stroke="#DCE7F5"/><line x1="992" y1="398" x2="992" y2="466" stroke="#DCE7F5"/><text x="94" y="440" class="cell" font-weight="600">大厦管理者等小游戏</text><text x="474" y="440" class="cell">手机</text><text x="684" y="427" class="cell"><tspan x="684" dy="0">模拟经营</tspan></text><text x="1014" y="414" class="desc"><tspan x="1014" dy="0">从二层小楼盖到摩天大厦，</tspan><tspan x="1014" dy="26">当包租公真上头</tspan></text><rect x="72" y="480" width="1656" height="96" fill="#FFFFFF"/><line x1="452" y1="494" x2="452" y2="562" stroke="#DCE7F5"/><line x1="662" y1="494" x2="662" y2="562" stroke="#DCE7F5"/><line x1="992" y1="494" x2="992" y2="562" stroke="#DCE7F5"/><text x="94" y="536" class="cell" font-weight="600">仙剑3</text><text x="474" y="536" class="cell">PC</text><text x="684" y="523" class="cell"><tspan x="684" dy="0">角色扮演（RPG）</tspan></text><text x="1014" y="510" class="desc"><tspan x="1014" dy="0">仙侠虐恋启蒙，</tspan><tspan x="1014" dy="26">为景天龙葵意难平了好久</tspan></text><rect x="72" y="576" width="1656" height="96" fill="#EFF6FF"/><line x1="452" y1="590" x2="452" y2="658" stroke="#DCE7F5"/><line x1="662" y1="590" x2="662" y2="658" stroke="#DCE7F5"/><line x1="992" y1="590" x2="992" y2="658" stroke="#DCE7F5"/><text x="94" y="632" class="cell" font-weight="600">剑侠情缘</text><text x="474" y="632" class="cell">PC</text><text x="684" y="619" class="cell"><tspan x="684" dy="0">角色扮演（RPG）</tspan></text><text x="1014" y="606" class="desc"><tspan x="1014" dy="0">西山居老牌武侠RPG，</tspan><tspan x="1014" dy="26">快意恩仇的江湖初体验</tspan></text><rect x="72" y="672" width="1656" height="96" fill="#FFFFFF"/><line x1="452" y1="686" x2="452" y2="754" stroke="#DCE7F5"/><line x1="662" y1="686" x2="662" y2="754" stroke="#DCE7F5"/><line x1="992" y1="686" x2="992" y2="754" stroke="#DCE7F5"/><text x="94" y="728" class="cell" font-weight="600">QQ音速&amp;炫舞</text><text x="474" y="728" class="cell">PC</text><text x="684" y="715" class="cell"><tspan x="684" dy="0">音乐舞蹈</tspan></text><text x="1014" y="702" class="desc"><tspan x="1014" dy="0">音乐节拍竞速加舞蹈按键，</tspan><tspan x="1014" dy="26">网吧时代的社交神器</tspan></text><rect x="72" y="768" width="1656" height="96" fill="#EFF6FF"/><line x1="452" y1="782" x2="452" y2="850" stroke="#DCE7F5"/><line x1="662" y1="782" x2="662" y2="850" stroke="#DCE7F5"/><line x1="992" y1="782" x2="992" y2="850" stroke="#DCE7F5"/><text x="94" y="824" class="cell" font-weight="600">QQ农场&amp;抢车位</text><text x="474" y="824" class="cell">PC</text><text x="684" y="811" class="cell"><tspan x="684" dy="0">社交休闲</tspan></text><text x="1014" y="798" class="desc"><tspan x="1014" dy="0">偷菜停车是幌子，</tspan><tspan x="1014" dy="26">和熟人互卷互动才是本体</tspan></text><rect x="72" y="864" width="1656" height="96" fill="#FFFFFF"/><line x1="452" y1="878" x2="452" y2="946" stroke="#DCE7F5"/><line x1="662" y1="878" x2="662" y2="946" stroke="#DCE7F5"/><line x1="992" y1="878" x2="992" y2="946" stroke="#DCE7F5"/><text x="94" y="920" class="cell" font-weight="600">穿越火线（CF）</text><text x="474" y="920" class="cell">PC</text><text x="684" y="907" class="cell"><tspan x="684" dy="0">射击（FPS）</tspan></text><text x="1014" y="894" class="desc"><tspan x="1014" dy="0">爆破运输船对枪，</tspan><tspan x="1014" dy="26">三亿鼠标的枪战启蒙</tspan></text><rect x="72" y="960" width="1656" height="96" fill="#EFF6FF"/><line x1="452" y1="974" x2="452" y2="1042" stroke="#DCE7F5"/><line x1="662" y1="974" x2="662" y2="1042" stroke="#DCE7F5"/><line x1="992" y1="974" x2="992" y2="1042" stroke="#DCE7F5"/><text x="94" y="1016" class="cell" font-weight="600">模拟人生3&amp;4</text><text x="474" y="1016" class="cell">PC</text><text x="684" y="1003" class="cell"><tspan x="684" dy="0">模拟经营</tspan></text><text x="1014" y="990" class="desc"><tspan x="1014" dy="0">捏人建房过日子，</tspan><tspan x="1014" dy="26">没有剧本的人生沙盒</tspan></text><rect x="72" y="1056" width="1656" height="96" fill="#FFFFFF"/><line x1="452" y1="1070" x2="452" y2="1138" stroke="#DCE7F5"/><line x1="662" y1="1070" x2="662" y2="1138" stroke="#DCE7F5"/><line x1="992" y1="1070" x2="992" y2="1138" stroke="#DCE7F5"/><text x="94" y="1112" class="cell" font-weight="600">Dark Lands（黑暗领地）</text><text x="474" y="1112" class="cell">手机</text><text x="684" y="1099" class="cell"><tspan x="684" dy="0">横版动作</tspan></text><text x="1014" y="1086" class="desc"><tspan x="1014" dy="0">黑白剪影跑酷砍杀，</tspan><tspan x="1014" dy="26">手慢一秒就重来</tspan></text><rect x="72" y="1152" width="1656" height="96" fill="#EFF6FF"/><line x1="452" y1="1166" x2="452" y2="1234" stroke="#DCE7F5"/><line x1="662" y1="1166" x2="662" y2="1234" stroke="#DCE7F5"/><line x1="992" y1="1166" x2="992" y2="1234" stroke="#DCE7F5"/><text x="94" y="1208" class="cell" font-weight="600">狼人杀</text><text x="474" y="1208" class="cell">手机</text><text x="684" y="1195" class="cell"><tspan x="684" dy="0">社交推理</tspan></text><text x="1014" y="1182" class="desc"><tspan x="1014" dy="0">一半演技一半逻辑，</tspan><tspan x="1014" dy="26">熟人互撕的快乐老家</tspan></text><rect x="72" y="1248" width="1656" height="96" fill="#FFFFFF"/><line x1="452" y1="1262" x2="452" y2="1330" stroke="#DCE7F5"/><line x1="662" y1="1262" x2="662" y2="1330" stroke="#DCE7F5"/><line x1="992" y1="1262" x2="992" y2="1330" stroke="#DCE7F5"/><text x="94" y="1304" class="cell" font-weight="600">全民超神</text><text x="474" y="1304" class="cell">手机</text><text x="684" y="1291" class="cell"><tspan x="684" dy="0">MOBA</tspan></text><text x="1014" y="1278" class="desc"><tspan x="1014" dy="0">最早的移动MOBA之一，</tspan><tspan x="1014" dy="26">双轮盘开黑青春</tspan></text><rect x="72" y="1344" width="1656" height="96" fill="#EFF6FF"/><line x1="452" y1="1358" x2="452" y2="1426" stroke="#DCE7F5"/><line x1="662" y1="1358" x2="662" y2="1426" stroke="#DCE7F5"/><line x1="992" y1="1358" x2="992" y2="1426" stroke="#DCE7F5"/><text x="94" y="1400" class="cell" font-weight="600">王者荣耀</text><text x="474" y="1400" class="cell">手机</text><text x="684" y="1387" class="cell"><tspan x="684" dy="0">MOBA</tspan></text><text x="1014" y="1374" class="desc"><tspan x="1014" dy="0">十五分钟一把的国民MOBA，</tspan><tspan x="1014" dy="26">社交硬通货</tspan></text><rect x="72" y="1440" width="1656" height="96" fill="#FFFFFF"/><line x1="452" y1="1454" x2="452" y2="1522" stroke="#DCE7F5"/><line x1="662" y1="1454" x2="662" y2="1522" stroke="#DCE7F5"/><line x1="992" y1="1454" x2="992" y2="1522" stroke="#DCE7F5"/><text x="94" y="1496" class="cell" font-weight="600">和平精英</text><text x="474" y="1496" class="cell">手机</text><text x="684" y="1483" class="cell"><tspan x="684" dy="0">射击（大逃杀）</tspan></text><text x="1014" y="1470" class="desc"><tspan x="1014" dy="0">跳伞搜装备进决赛圈，</tspan><tspan x="1014" dy="26">吃鸡那口紧张最上瘾</tspan></text><rect x="72" y="1536" width="1656" height="96" fill="#EFF6FF"/><line x1="452" y1="1550" x2="452" y2="1618" stroke="#DCE7F5"/><line x1="662" y1="1550" x2="662" y2="1618" stroke="#DCE7F5"/><line x1="992" y1="1550" x2="992" y2="1618" stroke="#DCE7F5"/><text x="94" y="1592" class="cell" font-weight="600">Monument Valley（纪念碑谷）</text><text x="474" y="1592" class="cell">手机</text><text x="684" y="1579" class="cell"><tspan x="684" dy="0">解谜</tspan></text><text x="1014" y="1566" class="desc"><tspan x="1014" dy="0">视觉错觉解谜，</tspan><tspan x="1014" dy="26">安静得像一场建筑梦</tspan></text><rect x="72" y="1632" width="1656" height="96" fill="#FFFFFF"/><line x1="452" y1="1646" x2="452" y2="1714" stroke="#DCE7F5"/><line x1="662" y1="1646" x2="662" y2="1714" stroke="#DCE7F5"/><line x1="992" y1="1646" x2="992" y2="1714" stroke="#DCE7F5"/><text x="94" y="1688" class="cell" font-weight="600">君临天下</text><text x="474" y="1688" class="cell">手机</text><text x="684" y="1675" class="cell"><tspan x="684" dy="0">策略（SLG）</tspan></text><text x="1014" y="1662" class="desc"><tspan x="1014" dy="0">三国攻城掠地，</tspan><tspan x="1014" dy="26">排兵布阵当主公</tspan></text><rect x="72" y="1728" width="1656" height="96" fill="#EFF6FF"/><line x1="452" y1="1742" x2="452" y2="1810" stroke="#DCE7F5"/><line x1="662" y1="1742" x2="662" y2="1810" stroke="#DCE7F5"/><line x1="992" y1="1742" x2="992" y2="1810" stroke="#DCE7F5"/><text x="94" y="1784" class="cell" font-weight="600">部落冲突</text><text x="474" y="1784" class="cell">手机</text><text x="684" y="1771" class="cell"><tspan x="684" dy="0">策略（SLG）</tspan></text><text x="1014" y="1758" class="desc"><tspan x="1014" dy="0">布阵抢资源打部落战，</tspan><tspan x="1014" dy="26">攻防两端都上头</tspan></text><rect x="72" y="1824" width="1656" height="96" fill="#FFFFFF"/><line x1="452" y1="1838" x2="452" y2="1906" stroke="#DCE7F5"/><line x1="662" y1="1838" x2="662" y2="1906" stroke="#DCE7F5"/><line x1="992" y1="1838" x2="992" y2="1906" stroke="#DCE7F5"/><text x="94" y="1880" class="cell" font-weight="600">重返帝国</text><text x="474" y="1880" class="cell">手机</text><text x="684" y="1867" class="cell"><tspan x="684" dy="0">策略（SLG）</tspan></text><text x="1014" y="1854" class="desc"><tspan x="1014" dy="0">不走格子自由行军，</tspan><tspan x="1014" dy="26">SLG玩出RTS手感</tspan></text><rect x="72" y="1920" width="1656" height="96" fill="#EFF6FF"/><line x1="452" y1="1934" x2="452" y2="2002" stroke="#DCE7F5"/><line x1="662" y1="1934" x2="662" y2="2002" stroke="#DCE7F5"/><line x1="992" y1="1934" x2="992" y2="2002" stroke="#DCE7F5"/><text x="94" y="1976" class="cell" font-weight="600">女神异闻录（P5R）</text><text x="474" y="1976" class="cell">主机（PS）</text><text x="684" y="1963" class="cell"><tspan x="684" dy="0">角色扮演（RPG）</tspan></text><text x="1014" y="1950" class="desc"><tspan x="1014" dy="0">白天高中生深夜怪盗，</tspan><tspan x="1014" dy="26">回合制也能很时髦</tspan></text><rect x="72" y="2016" width="1656" height="96" fill="#FFFFFF"/><line x1="452" y1="2030" x2="452" y2="2098" stroke="#DCE7F5"/><line x1="662" y1="2030" x2="662" y2="2098" stroke="#DCE7F5"/><line x1="992" y1="2030" x2="992" y2="2098" stroke="#DCE7F5"/><text x="94" y="2072" class="cell" font-weight="600">双人成行</text><text x="474" y="2072" class="cell">PC/主机</text><text x="684" y="2059" class="cell"><tspan x="684" dy="0">动作冒险（双人合作）</tspan></text><text x="1014" y="2046" class="desc"><tspan x="1014" dy="0">每关都换玩法，</tspan><tspan x="1014" dy="26">双人游戏的教科书</tspan></text><rect x="72" y="2112" width="1656" height="96" fill="#EFF6FF"/><line x1="452" y1="2126" x2="452" y2="2194" stroke="#DCE7F5"/><line x1="662" y1="2126" x2="662" y2="2194" stroke="#DCE7F5"/><line x1="992" y1="2126" x2="992" y2="2194" stroke="#DCE7F5"/><text x="94" y="2168" class="cell" font-weight="600">刺客信条</text><text x="474" y="2168" class="cell">PC/主机</text><text x="684" y="2155" class="cell"><tspan x="684" dy="0">动作冒险</tspan></text><text x="1014" y="2142" class="desc"><tspan x="1014" dy="0">在历史里跑酷刺杀，</tspan><tspan x="1014" dy="26">信仰之跃看风景</tspan></text><rect x="72" y="2208" width="1656" height="96" fill="#FFFFFF"/><line x1="452" y1="2222" x2="452" y2="2290" stroke="#DCE7F5"/><line x1="662" y1="2222" x2="662" y2="2290" stroke="#DCE7F5"/><line x1="992" y1="2222" x2="992" y2="2290" stroke="#DCE7F5"/><text x="94" y="2264" class="cell" font-weight="600">光遇</text><text x="474" y="2264" class="cell">手机</text><text x="684" y="2251" class="cell"><tspan x="684" dy="0">社交冒险</tspan></text><text x="1014" y="2238" class="desc"><tspan x="1014" dy="0">不用聊天也能交心，</tspan><tspan x="1014" dy="26">陌生人之间的温柔</tspan></text><rect x="72" y="2304" width="1656" height="96" fill="#EFF6FF"/><line x1="452" y1="2318" x2="452" y2="2386" stroke="#DCE7F5"/><line x1="662" y1="2318" x2="662" y2="2386" stroke="#DCE7F5"/><line x1="992" y1="2318" x2="992" y2="2386" stroke="#DCE7F5"/><text x="94" y="2360" class="cell" font-weight="600">崩坏3</text><text x="474" y="2360" class="cell">手机</text><text x="684" y="2347" class="cell"><tspan x="684" dy="0">动作RPG（ARPG）</tspan></text><text x="1014" y="2334" class="desc"><tspan x="1014" dy="0">三渲二动作打击感，</tspan><tspan x="1014" dy="26">二次元动作门面</tspan></text><rect x="72" y="2400" width="1656" height="96" fill="#FFFFFF"/><line x1="452" y1="2414" x2="452" y2="2482" stroke="#DCE7F5"/><line x1="662" y1="2414" x2="662" y2="2482" stroke="#DCE7F5"/><line x1="992" y1="2414" x2="992" y2="2482" stroke="#DCE7F5"/><text x="94" y="2456" class="cell" font-weight="600">节奏光剑</text><text x="474" y="2456" class="cell">VR</text><text x="684" y="2443" class="cell"><tspan x="684" dy="0">音乐节奏（VR）</tspan></text><text x="1014" y="2430" class="desc"><tspan x="1014" dy="0">跟着节奏挥光剑，</tspan><tspan x="1014" dy="26">最解压的VR运动</tspan></text><rect x="72" y="2496" width="1656" height="96" fill="#EFF6FF"/><line x1="452" y1="2510" x2="452" y2="2578" stroke="#DCE7F5"/><line x1="662" y1="2510" x2="662" y2="2578" stroke="#DCE7F5"/><line x1="992" y1="2510" x2="992" y2="2578" stroke="#DCE7F5"/><text x="94" y="2552" class="cell" font-weight="600">塞尔达-旷野之息</text><text x="474" y="2552" class="cell">主机（Switch）</text><text x="684" y="2539" class="cell"><tspan x="684" dy="0">动作冒险（开放世界）</tspan></text><text x="1014" y="2526" class="desc"><tspan x="1014" dy="0">没有任务清单，</tspan><tspan x="1014" dy="26">看见山就能爬上去</tspan></text><rect x="72" y="2592" width="1656" height="96" fill="#FFFFFF"/><line x1="452" y1="2606" x2="452" y2="2674" stroke="#DCE7F5"/><line x1="662" y1="2606" x2="662" y2="2674" stroke="#DCE7F5"/><line x1="992" y1="2606" x2="992" y2="2674" stroke="#DCE7F5"/><text x="94" y="2648" class="cell" font-weight="600">超级马里奥-奥德赛</text><text x="474" y="2648" class="cell">主机（Switch）</text><text x="684" y="2635" class="cell"><tspan x="684" dy="0">平台跳跃</tspan></text><text x="1014" y="2622" class="desc"><tspan x="1014" dy="0">跳跃干净利落，</tspan><tspan x="1014" dy="26">附身系统脑洞全开</tspan></text><rect x="72" y="210" width="1656" height="2478" rx="18" fill="none" stroke="#CBD5E1" stroke-width="2"/></svg>